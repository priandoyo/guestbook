<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Secure Guestbook</title>

  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>

<body>

<div class="container">

  <header>
    <h1>Secure Guestbook</h1>
    <p>Share your thoughts with the community.</p>
  </header>

  <div id="status" role="status"
    aria-live="polite"></div>

  <!-- Registration and Login -->
  <section id="auth">

    <h2>Register</h2>

    <form id="registerForm">

      <input name="username"
        placeholder="Username"
        minlength="2"
        maxlength="50"
        required>

      <input name="email"
        type="email"
        placeholder="Email"
        maxlength="254"
        required>

      <input name="password"
        type="password"
        placeholder="Password (12+ characters)"
        minlength="12"
        required>

      <button type="submit">Register</button>

    </form>

    <hr>

    <h2>Login</h2>

    <form id="loginForm">

      <input name="email"
        type="email"
        placeholder="Email"
        required>

      <input name="password"
        type="password"
        placeholder="Password"
        required>

      <button type="submit">Login</button>

    </form>

  </section>

  <!-- Authenticated User -->
  <section id="userPanel" hidden>

    <p>
      Logged in as
      <strong id="username"></strong>
    </p>

    <button type="button" id="logoutBtn">
      Logout
    </button>

    <h2>Write a Message</h2>

    <form id="messageForm">

      <textarea name="message"
        maxlength="500"
        placeholder="Your message..."
        required></textarea>

      <p id="counter">0 / 500</p>

      <button type="submit">
        Post Message
      </button>

    </form>

  </section>

  <!-- Public Guestbook -->
  <section>

    <h2>Guestbook Messages</h2>

    <div id="messages"></div>

  </section>

</div>

</body>
</html>
