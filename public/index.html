<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Guestbook</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

  <header>
    <h1>Secure Guestbook</h1>
    <p>Share your thoughts with the community.</p>
  </header>

  <div id="status"></div>

  <section id="auth">
    <h2>Register</h2>

    <form id="registerForm">
      <input name="username" placeholder="Username" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password"
        placeholder="Password (12+ characters)" required minlength="12">
      <button>Register</button>
    </form>

    <hr>

    <h2>Login</h2>

    <form id="loginForm">
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password" required>
      <button>Login</button>
    </form>
  </section>

  <section id="userPanel" hidden>
    <p>Logged in as <strong id="username"></strong></p>
    <button id="logoutBtn">Logout</button>

    <h2>Write a Message</h2>

    <form id="messageForm">
      <textarea name="message" maxlength="500"
        placeholder="Your message..." required></textarea>
      <p id="counter">0 / 500</p>
      <button>Post Message</button>
    </form>
  </section>

  <section>
    <h2>Guestbook Messages</h2>
    <div id="messages"></div>
  </section>

</div>

<script>
const $ = id => document.getElementById(id);

async function api(url, options = {}) {
  const headers = {
    ...(options.body ? { 'Content-Type': 'application/json' } : {}),
    ...(options.headers || {})
  };

  if (options.method && options.method !== 'GET') {
    const csrf = await fetch('/api/csrf').then(r => r.json());
    headers['X-CSRF-Token'] = csrf.csrfToken;
  }

  const response = await fetch(url, {
    ...options,
    headers,
    credentials: 'same-origin'
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || 'Request failed');
  }

  return data;
}

function showStatus(message) {
  $('status').textContent = message;
}

async function loadMessages() {
  const messages = await api('/api/messages');
  const container = $('messages');

  container.replaceChildren();

  messages.forEach(item => {
    const card = document.createElement('div');
    card.className = 'message';

    const author = document.createElement('strong');
    author.textContent = item.username;

    const content = document.createElement('p');
    content.textContent = item.message;

    const date = document.createElement('small');
    date.textContent = item.created_at;

    card.append(author, content, date);
    container.appendChild(card);
  });
}

async function checkLogin() {
  const data = await api('/api/auth/me');

  $('auth').hidden = !!data.user;
  $('userPanel').hidden = !data.user;

  if (data.user) {
    $('username').textContent = data.user.username;
  }
}

$('registerForm').addEventListener('submit', async e => {
  e.preventDefault();

  try {
    const form = new FormData(e.target);

    await api('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify(Object.fromEntries(form))
    });

    showStatus('Registration successful!');
    e.target.reset();
    await checkLogin();

  } catch (err) {
    showStatus(err.message);
  }
});

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();

  try {
    const form = new FormData(e.target);

    await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify(Object.fromEntries(form))
    });

    showStatus('Login successful!');
    e.target.reset();
    await checkLogin();

  } catch (err) {
    showStatus(err.message);
  }
});

$('logoutBtn').addEventListener('click', async () => {
  try {
    await api('/api/auth/logout', { method: 'POST' });
    showStatus('You have logged out.');
    await checkLogin();
  } catch (err) {
    showStatus(err.message);
  }
});

$('messageForm').addEventListener('submit', async e => {
  e.preventDefault();

  try {
    const message = new FormData(e.target).get('message');

    await api('/api/messages', {
      method: 'POST',
      body: JSON.stringify({ message })
    });

    showStatus('Success! Your message has been published.');
    e.target.reset();
    $('counter').textContent = '0 / 500';

    await loadMessages();

  } catch (err) {
    showStatus(err.message);
  }
});

$('messageForm').message.addEventListener('input', e => {
  $('counter').textContent = `${e.target.value.length} / 500`;
});

async function init() {
  try {
    await checkLogin();
    await loadMessages();
  } catch (err) {
    showStatus(err.message);
  }
}

init();
</script>

</body>
</html>
